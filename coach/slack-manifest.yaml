display_information:
  name: Coach
  description: Answers questions about your daily cards
  background_color: "#5B21B6"
features:
  bot_user:
    display_name: Coach
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - reactions:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
